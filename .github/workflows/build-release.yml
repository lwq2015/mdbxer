# 全平台构建与发布流水线：
#   tag（v*）推送到 GitHub 后，并行构建 Windows / Linux / macOS，
#   自动发布 GitHub Release。
#   Gitee Release 作为可选项（因 GitHub Actions runner 访问 Gitee API 可能超时）。
#
# 触发方式：
#   1. tag 被推送到 GitHub（通常由 Gitee 仓库镜像自动同步过来）
#   2. 手动 workflow_dispatch（只构建，不发布）
#
# 前置配置：
#   - GitHub 仓库 Settings → Secrets → Actions 添加 GITEE_TOKEN（Gitee 私人令牌，可选）

name: 构建与发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mdbxer.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mdbxer
          - os: macos-14 # Apple Silicon；GitHub 无 Intel macOS runner，Intel Mac 走 Rosetta 2
            target: aarch64-apple-darwin
            bin: mdbxer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Linux 构建依赖（rfd 走 GTK3）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: 构建
        run: cargo build --release --locked

      - name: 打包（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/mdbxer-${{ matrix.target }}.tar.gz" \
            -C target/release "${{ matrix.bin }}" \
            -C "$GITHUB_WORKSPACE" LICENSE NOTICE README.md

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/release/${{ matrix.bin }}", LICENSE, NOTICE, README.md `
            -DestinationPath "dist/mdbxer-${{ matrix.target }}.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mdbxer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Release 正文 = annotated tag message（发版时把功能清单写进 tag 说明；
      # generate_release_notes 仍会追加 Full Changelog 链接）
      - name: 取 annotated tag 说明作为 Release 正文
        id: tagbody
        run: |
          git fetch --tags --force
          {
            echo "BODY<<EOF"
            git tag -l --format='%(contents)' "${{ github.ref_name }}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: mdbxer-*
          path: dist
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tagbody.outputs.BODY }}
          generate_release_notes: true
          files: dist/*

  # 说明（2026-10-18 移除）：Release 统一放 GitHub，Gitee 只作 git 镜像同步 tag。
  # gitee-release 任务原本把三平台产物回传给 Gitee Release，但 GitHub runner 访问
  # Gitee API 偶发拒连/重置，历史上约半版本回传失败，需本地手动补发，得不偿失。
  # Gitee 侧用户下载入口已指向 GitHub Releases；Gitee 页面保留自动生成的源码包
  # （v*.zip/tar.gz）。发版技能 mdbxer-release 提供本地补发流程，如需恢复再启用此任务。
