# 全平台构建与发布流水线：
#   tag（v*）推送到 GitHub 后，并行构建 Windows / Linux / macOS，
#   自动发布 GitHub Release。
#   Gitee Release 作为可选项（因 GitHub Actions runner 访问 Gitee API 可能超时）。
#
# 触发方式：
#   1. tag 被推送到 GitHub（通常由 Gitee 仓库镜像自动同步过来）
#   2. 手动 workflow_dispatch（只构建，不发布）
#
# 前置配置：
#   - GitHub 仓库 Settings → Secrets → Actions 添加 GITEE_TOKEN（Gitee 私人令牌，可选）

name: 构建与发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: mdbxer.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: mdbxer
          - os: macos-14 # Apple Silicon；GitHub 无 Intel macOS runner，Intel Mac 走 Rosetta 2
            target: aarch64-apple-darwin
            bin: mdbxer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: Linux 构建依赖（rfd 走 GTK3）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: 构建
        run: cargo build --release --locked

      - name: 打包（Linux/macOS）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist
          tar -czf "dist/mdbxer-${{ matrix.target }}.tar.gz" \
            -C target/release "${{ matrix.bin }}" \
            -C "$GITHUB_WORKSPACE" LICENSE NOTICE README.md

      - name: 打包（Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path "target/release/${{ matrix.bin }}", LICENSE, NOTICE, README.md `
            -DestinationPath "dist/mdbxer-${{ matrix.target }}.zip"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: mdbxer-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mdbxer-*
          path: dist
          merge-multiple: true

      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

  gitee-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    continue-on-error: true # GitHub Actions runner 访问 Gitee API 可能超时，不阻塞整体发布
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mdbxer-*
          path: dist
          merge-multiple: true

      - name: 创建 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -e
          REPO="lwq_yu/mdbxer"
          # 已存在则复用（按 tag 查列表），不存在则创建
          ID=$(curl -s "https://gitee.com/api/v5/repos/${REPO}/releases?access_token=${GITEE_TOKEN}&per_page=100" \
            | jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag) | .id' | head -n1)
          if [ -z "$ID" ]; then
            jq -n \
              --arg at "$GITEE_TOKEN" \
              --arg tag "$TAG" \
              --arg name "$TAG" \
              --arg body "全平台构建产物由 GitHub Actions 自动构建：Windows (x86_64)、Linux (x86_64)、macOS Intel (x86_64)、macOS Apple Silicon (aarch64)。" \
              '{access_token: $at, tag_name: $tag, name: $name, body: $body, target_commitish: "master"}' \
            | curl -s -X POST -H "Content-Type: application/json" -d @- \
              "https://gitee.com/api/v5/repos/${REPO}/releases" > /tmp/rel.json
            ID=$(jq -r .id /tmp/rel.json)
          fi
          [ -n "$ID" ] && [ "$ID" != "null" ] || { echo "创建 Release 失败"; cat /tmp/rel.json 2>/dev/null; exit 1; }
          echo "GITEE_RELEASE_ID=$ID" >> "$GITHUB_ENV"

      - name: 上传附件到 Gitee Release
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          set -e
          REPO="lwq_yu/mdbxer"
          for f in dist/*; do
            echo "上传 $f"
            curl -s -X POST \
              -F "access_token=${GITEE_TOKEN}" \
              -F "file=@${f}" \
              "https://gitee.com/api/v5/repos/${REPO}/releases/${GITEE_RELEASE_ID}/attach_files" > /dev/null
          done
