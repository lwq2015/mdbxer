[package]
name = "mdbxer"
version = "0.1.4"
edition = "2024"
license = "Apache-2.0"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
libmdbx = { git = "https://github.com/vorot93/libmdbx-rs.git", branch = "master" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
encoding_rs = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
