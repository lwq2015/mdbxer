[package]
name = "mdbxer"
version = "0.1.13"
edition = "2024"
license = "Apache-2.0"

[dependencies]
# persistence：退出/自动保存时把窗口几何与 egui 记忆（含表格列宽）落到 ui-state.ron
eframe = { version = "0.36.2", features = ["persistence"] }
egui = "0.36.2"
# serde：表格列宽走 egui 的持久化存储（配合 eframe persistence 跨会话保留）
egui_extras = { version = "0.36.2", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "ico"] }
libmdbx = { git = "https://github.com/vorot93/libmdbx-rs.git", branch = "master" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bson = "2"
rfd = "0.15"
encoding_rs = "0.8"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
# 仅 examples/make_test_db.rs 用：动态编码 proto 测试样本（须与 prost-reflect 所用版本一致）
prost = "0.14"
rmpv = "1.3.1"
zstd = "0.14.3"
flate2 = "1.1.10"
lz4_flex = "0.14.0"
bzip2 = "0.6"
lzma-rs = "0.3"
ciborium = "0.2.2"
serde_yaml = "0.9"
toml = "0.8"
roxmltree = "0.20"
snap = "1"
# 值搜索的正则模式（.* 开关）
regex = "1"
# 详情卡片的校验和（MD5 / SHA-1 / SHA-256）
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
# 仅运行时解压（brotli 无魔数，试探解码兜底）
brotli-decompressor = "4"

[build-dependencies]
winres = "0.1"

# Windows 专用：原生标题栏深色切换。winit 的 set_theme 只写 DWMWA_USE_IMMERSIVE_DARK_MODE(20)，
# 旧版 Win10（< 18985）只认属性 19，且不会强制非客户区重绘，表现为切主题时客户区变了、标题栏没变。
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[dev-dependencies]
# 测试用：生成 brotli 压缩样本（运行时只用 brotli-decompressor）
brotli = "7"

[profile.release]
opt-level = 3
lto = "thin"
