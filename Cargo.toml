[package]
name = "mdbxer"
version = "0.1.11"
edition = "2024"
license = "Apache-2.0"

[dependencies]
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
image = { version = "0.25", default-features = false, features = ["png"] }
libmdbx = { git = "https://github.com/vorot93/libmdbx-rs.git", branch = "master" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bson = "2"
rfd = "0.15"
encoding_rs = "0.8"
prost-reflect = { version = "0.16.5", features = ["serde"] }
protox = "0.10.0"
# 仅 examples/make_test_db.rs 用：动态编码 proto 测试样本（须与 prost-reflect 所用版本一致）
prost = "0.14"
rmpv = "1.3.1"
zstd = "0.14.3"
flate2 = "1.1.10"
lz4_flex = "0.14.0"
bzip2 = "0.6"
lzma-rs = "0.3"
ciborium = "0.2.2"
serde_yaml = "0.9"
toml = "0.8"
roxmltree = "0.20"
snap = "1"
# 仅运行时解压（brotli 无魔数，试探解码兜底）
brotli-decompressor = "4"

[build-dependencies]
winres = "0.1"

[dev-dependencies]
# 测试用：生成 brotli 压缩样本（运行时只用 brotli-decompressor）
brotli = "7"

[profile.release]
opt-level = 3
lto = "thin"
